<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1b2e">
    <title>Kepolisian Nexotis - Login</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-wrap auth">
    <div class="login-card">
      <div class="auth-head">
        <div class="auth-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z"/><path d="M12 8.2l1.2 2.4 2.6.4-1.9 1.8.5 2.6-2.4-1.3-2.4 1.3.5-2.6-1.9-1.8 2.6-.4z" fill="currentColor" stroke="none"/></svg></div>
        <h1>KEPOLISIAN NEXOTIS</h1>
        <p class="auth-sub" id="auth-sub">Masuk pakai akun anggota kamu.</p>
      </div>

      <!-- ====== Form login ====== -->
      <div id="view-login">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="field"><svg class="ico-l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg><input type="text" id="username" placeholder="username kamu" autocomplete="username"></div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="field has-eye"><svg class="ico-l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><input type="password" id="password" placeholder="password kamu" autocomplete="current-password"><button type="button" class="eye" aria-label="Lihat/sembunyikan password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      </div>
        <button class="btn btn-primary" id="login-btn">Masuk</button>
        <div class="error-msg" id="error-msg"></div>
        <div class="auth-links">
          <a href="#" id="to-lupa">Lupa username / password?</a>
          <a href="register.html" class="hl">Daftar akun &rarr;</a>
        </div>
      </div>

      <!-- ====== Form lupa akun ====== -->
      <div id="view-lupa" style="display:none">
      <div class="form-group">
        <label for="lupa-email">Email terdaftar</label>
        <div class="field"><svg class="ico-l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><input type="email" id="lupa-email" placeholder="contoh@gmail.com" autocomplete="email"></div>
        <div class="hint">Detail akun (username) dan link atur password baru bakal dikirim ke email ini.</div>
      </div>
        <button class="btn btn-primary" id="lupa-btn">Kirim ke Email</button>
        <div class="error-msg" id="lupa-msg"></div>
        <div class="auth-links"><a href="#" id="to-login">&larr; Balik ke login</a></div>
      </div>

      <div class="foot">© 2026 Kepolisian Nexotis</div>
    </div>
  </div>

<script src="app.js"></script>
<script>
  // Kalau sesi masih aktif, langsung ke dashboard
  (async () => {
    try { await api("/api/me"); window.location.href = "dashboard.html"; }
    catch (e) { /* belum login, tetap di sini */ }
  })();

  const $ = (id) => document.getElementById(id);
  function tampil(view) {
    $("view-login").style.display = view === "login" ? "" : "none";
    $("view-lupa").style.display = view === "lupa" ? "" : "none";
    $("auth-sub").textContent = view === "login" ? "Masuk pakai akun anggota kamu." : "Pulihkan akses akun lewat email.";
  }
  $("to-lupa").addEventListener("click", (e) => { e.preventDefault(); tampil("lupa"); });
  $("to-login").addEventListener("click", (e) => { e.preventDefault(); tampil("login"); });

  $("login-btn").addEventListener("click", doLogin);
  $("password").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });

  async function doLogin() {
    const errorEl = $("error-msg");
    errorEl.textContent = "";
    const username = $("username").value.trim();
    const password = $("password").value;
    if (!username || !password) { errorEl.textContent = "Username & password wajib diisi."; return; }

    const btn = $("login-btn");
    btn.disabled = true; btn.textContent = "Memeriksa...";
    try {
      await api("/api/auth-login", { method: "POST", body: JSON.stringify({ username, password }) });
      window.location.href = "dashboard.html";
    } catch (e) {
      errorEl.textContent = e.message;
    } finally {
      btn.disabled = false; btn.textContent = "Masuk";
    }
  }

  $("lupa-btn").addEventListener("click", doLupa);
  $("lupa-email").addEventListener("keydown", (e) => { if (e.key === "Enter") doLupa(); });

  async function doLupa() {
    const msgEl = $("lupa-msg");
    msgEl.style.color = "";
    msgEl.textContent = "";
    const email = $("lupa-email").value.trim();
    if (!email) { msgEl.textContent = "Email wajib diisi."; return; }

    const btn = $("lupa-btn");
    btn.disabled = true; btn.textContent = "Mengirim...";
    try {
      const r = await api("/api/auth-login", { method: "POST", body: JSON.stringify({ lupa: true, email }) });
      msgEl.style.color = "var(--green)";
      msgEl.textContent = r.message || "Detail akun sudah dikirim ke email kamu.";
    } catch (e) {
      msgEl.textContent = e.message;
    } finally {
      btn.disabled = false; btn.textContent = "Kirim ke Email";
    }
  }
</script>
</body>
</html>
