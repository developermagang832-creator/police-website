<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kepolisian Nexotis - Login</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="flag">🚔</div>
      <h1>KEPOLISIAN NEXOTIS</h1>
      <p>Masuk dengan akun yang diberikan Petinggi. Belum punya akun? <a href="register.html" style="color: red; font-weight: bold;">Daftar di sini</a>.</p>
  
      <div class="form-group" style="text-align:left">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="username kamu" autocomplete="username">
      </div>
      <div class="form-group" style="text-align:left">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="password kamu" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" style="width:100%" id="login-btn">Masuk</button>
      <div class="error-msg" id="error-msg"></div>
      <div class="foot">© 2026 Kepolisian Nexotis</div>
    </div>
  </div>

<script src="app.js"></script>
<script>
  // Kalau sesi masih aktif, langsung ke dashboard
  (async () => {
    try { await api("/api/me"); window.location.href = "dashboard.html"; }
    catch (e) { /* belum login, tetap di sini */ }
  })();

  document.getElementById("login-btn").addEventListener("click", doLogin);
  document.getElementById("password").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });

  async function doLogin() {
    const errorEl = document.getElementById("error-msg");
    errorEl.textContent = "";
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    if (!username || !password) { errorEl.textContent = "Username & password wajib diisi."; return; }

    const btn = document.getElementById("login-btn");
    btn.disabled = true; btn.textContent = "Memeriksa...";
    try {
      await api("/api/auth-login", { method: "POST", body: JSON.stringify({ username, password }) });
      window.location.href = "dashboard.html";
    } catch (e) {
      errorEl.textContent = e.message;
    } finally {
      btn.disabled = false; btn.textContent = "Masuk";
    }
  }
</script>
</body>
</html>
