<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kepolisian Nexotis - Dashboard Warga</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="navbar">
    <div class="brand"><span class="flag">🚔</span> kepolisian nexotis</div>
    <div style="flex:1"></div>
    <div class="user">
      <div class="info">
        <div class="name" id="w-nama">...</div>
        <div class="rank">Warga · Discord</div>
      </div>
      <div class="avatar" id="w-avatar"></div>
    </div>
    <button class="btn btn-secondary" id="logout-btn" style="margin-left:12px">Logout</button>
  </div>

  <div class="container" style="max-width:820px;margin:20px auto;padding:0 14px">
    <div class="card">
      <h2>Selamat datang, <span id="w-halo">warga</span></h2>
      <p style="font-size:13px;color:var(--muted);margin:6px 0 0">
        Ini dashboard publik Kepolisian Nexotis untuk warga. Kamu masuk lewat akun Discord.
      </p>
      <div id="w-info" style="font-size:12px;color:var(--faint);margin-top:10px"></div>
    </div>

    <div class="card">
      <h2>Forum Kritik &amp; Saran</h2>
      <p style="font-size:13px;color:var(--muted);margin:6px 0 12px">
        Punya kritik atau saran buat Kepolisian Nexotis? Tulis di forum, dan warga lain bisa ikut berkomentar.
      </p>
      <a class="btn btn-primary" href="forum.html" style="display:inline-block;text-decoration:none">Buka Forum</a>
    </div>
  </div>

  <!-- Popup Iklan (sama seperti dashboard anggota) -->
  <div class="modal-overlay" id="iklan-modal">
    <div class="modal-box" style="max-width:420px;text-align:left">
      <div id="iklan-modal-content"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px">
        <div id="iklan-modal-nav" style="font-size:12px;color:var(--faint)"></div>
        <button class="btn btn-secondary" id="iklan-modal-close">Tutup</button>
      </div>
    </div>
  </div>

<script src="app.js"></script>
<script>
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function tgl(iso) {
    try { return new Date(iso).toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "numeric" }); }
    catch (e) { return "-"; }
  }

  // ====== Popup Iklan: muncul sekali tiap halaman dibuka / di-refresh ======
  let iklanList = [];
  let iklanIndex = 0;
  function renderIklanModal() {
    const k = iklanList[iklanIndex];
    document.getElementById("iklan-modal-content").innerHTML = `
      ${k.foto && String(k.foto).startsWith("http") ? `<img src="${esc(k.foto)}" style="width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin-bottom:12px">` : ""}
      ${k.teks ? `<div style="font-size:13px;white-space:pre-wrap">${esc(k.teks)}</div>` : ""}`;
    const navEl = document.getElementById("iklan-modal-nav");
    if (iklanList.length > 1) {
      navEl.innerHTML = `
        <button class="btn-link" id="iklan-prev" ${iklanIndex === 0 ? "disabled" : ""}>‹ Sebelumnya</button>
        <span style="margin:0 6px">${iklanIndex + 1}/${iklanList.length}</span>
        <button class="btn-link" id="iklan-next" ${iklanIndex === iklanList.length - 1 ? "disabled" : ""}>Berikutnya ›</button>`;
      document.getElementById("iklan-prev").addEventListener("click", () => { if (iklanIndex > 0) { iklanIndex--; renderIklanModal(); } });
      document.getElementById("iklan-next").addEventListener("click", () => { if (iklanIndex < iklanList.length - 1) { iklanIndex++; renderIklanModal(); } });
    } else navEl.innerHTML = "";
  }
  document.getElementById("iklan-modal-close").addEventListener("click", () => document.getElementById("iklan-modal").classList.remove("open"));

  (async () => {
    let data;
    try { data = await api("/api/auth-login?aksi=warga-me"); }
    catch (e) { window.location.href = "index.html"; return; }

    const w = data.warga;
    document.getElementById("w-nama").textContent = w.nama;
    document.getElementById("w-halo").textContent = w.nama;
    const av = document.getElementById("w-avatar");
    if (w.avatar) { av.style.backgroundImage = `url('${w.avatar}')`; av.style.backgroundSize = "cover"; }
    else av.textContent = w.nama.slice(0, 2).toUpperCase();
    document.getElementById("w-info").textContent = `Discord: @${w.username} · Login terakhir: ${tgl(w.terakhirLogin)}`;

    iklanList = data.iklan || [];
    if (iklanList.length) { iklanIndex = 0; renderIklanModal(); document.getElementById("iklan-modal").classList.add("open"); }
  })();

  document.getElementById("logout-btn").addEventListener("click", async () => {
    try { await api("/api/auth-login?aksi=warga-logout", { method: "POST" }); } catch (e) { /* lanjut */ }
    window.location.href = "index.html";
  });
</script>
</body>
</html>
