<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kepolisian Nexotis - Atur Password Baru</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="flag"><svg class="logo-svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z"/><path d="M12 8.2l1.2 2.4 2.6.4-1.9 1.8.5 2.6-2.4-1.3-2.4 1.3.5-2.6-1.9-1.8 2.6-.4z" fill="currentColor" stroke="none"/></svg></div>
      <h1>ATUR PASSWORD BARU</h1>
      <p>Masukin password baru buat akun kamu.</p>

      <div class="form-group" style="text-align:left">
        <label for="new-password">Password Baru</label>
        <input type="password" id="new-password" placeholder="minimal 6 karakter" autocomplete="new-password">
      </div>
      <div class="form-group" style="text-align:left">
        <label for="new-password2">Ulangi Password Baru</label>
        <input type="password" id="new-password2" placeholder="ketik ulang password" autocomplete="new-password">
      </div>
      <button class="btn btn-primary" style="width:100%" id="reset-btn">Simpan Password</button>
      <div class="error-msg" id="error-msg"></div>
      <div class="foot"><a href="index.html" style="color: red; font-weight: bold;">Balik ke login</a></div>
    </div>
  </div>

<script src="app.js"></script>
<script>
  const token = new URLSearchParams(location.search).get("token") || "";
  const errorEl = document.getElementById("error-msg");
  if (!token) errorEl.textContent = "Link nggak valid. Minta link baru dari halaman login (Lupa username / password).";

  document.getElementById("reset-btn").addEventListener("click", doReset);
  document.getElementById("new-password2").addEventListener("keydown", (e) => { if (e.key === "Enter") doReset(); });

  async function doReset() {
    errorEl.style.color = "";
    errorEl.textContent = "";
    const p1 = document.getElementById("new-password").value;
    const p2 = document.getElementById("new-password2").value;
    if (!token) return;
    if (p1.length < 6) { errorEl.textContent = "Password minimal 6 karakter."; return; }
    if (p1 !== p2) { errorEl.textContent = "Password dan ulangannya nggak sama."; return; }

    const btn = document.getElementById("reset-btn");
    btn.disabled = true; btn.textContent = "Menyimpan...";
    try {
      await api("/api/auth-login", { method: "POST", body: JSON.stringify({ reset: true, token, password: p1 }) });
      errorEl.style.color = "var(--green)";
      errorEl.textContent = "Password berhasil diganti. Mengarahkan ke halaman login...";
      setTimeout(() => { window.location.href = "index.html"; }, 1500);
    } catch (e) {
      errorEl.textContent = e.message;
      btn.disabled = false; btn.textContent = "Simpan Password";
    }
  }
</script>
</body>
</html>
