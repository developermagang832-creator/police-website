<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kepolisian Nexotis - Daftar Akun</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-wrap auth">
    <div class="login-card">
      <div class="flag"><svg class="logo-svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z"/><path d="M12 8.2l1.2 2.4 2.6.4-1.9 1.8.5 2.6-2.4-1.3-2.4 1.3.5-2.6-1.9-1.8 2.6-.4z" fill="currentColor" stroke="none"/></svg></div>
      <h1>DAFTAR AKUN BARU</h1>
      <p id="auth-sub-reg">Akun kamu perlu di-approve Perwira Tinggi dulu sebelum bisa login.</p>
      <div class="form-group">
        <label for="reg-username">Username</label>
        <input type="text" id="reg-username" placeholder="username buat login" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="reg-email">Email (Gmail)</label>
        <div class="row-inline">
          <input type="email" id="reg-email" placeholder="contoh@gmail.com" autocomplete="email">
          <button type="button" class="btn btn-secondary" id="kirim-kode">Kirim Kode</button>
        </div>
        <div class="hint" id="kode-hint">Kode verifikasi 6 digit akan dikirim ke email ini.</div>
      </div>
      <div class="form-group">
        <label for="reg-kode-email">Kode Verifikasi Email</label>
        <input type="text" id="reg-kode-email" placeholder="6 digit dari email" autocomplete="one-time-code">
      </div>
      <div class="form-group">
        <label for="reg-password">Password</label>
        <div class="pass-wrap"><input type="password" id="reg-password" placeholder="minimal 6 karakter" autocomplete="new-password"><button type="button" class="eye" tabindex="-1">Lihat</button></div>
      </div>
      <div class="form-group">
        <label for="reg-nama">Nama Karakter</label>
        <input type="text" id="reg-nama" placeholder="nama character kamu" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="reg-pangkat">Pangkat yang Diajukan</label>
        <select id="reg-pangkat"></select>
        <div class="auth-note" id="pangkat-note"><b>Pangkat tertinggi:</b> langsung aktif sebagai High Command, tanpa menunggu approval.</div>
      </div>
      <div class="form-group" id="kode-wrap" style="display:none">
        <label for="reg-kode">Kode Akses <span style="font-weight:400;color:var(--faint)">(kalau diminta)</span></label>
        <input type="password" id="reg-kode" placeholder="kosongkan kalau nggak ada" autocomplete="off">
      </div>
      <button class="btn btn-primary" id="register-btn">Daftar</button>
      <div class="error-msg" id="error-msg"></div>
      <div class="foot">Sudah punya akun? <a href="index.html">Masuk di sini</a></div>
    </div>
  </div>

<script src="app.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const pangkatSelect = $("reg-pangkat");
  pangkatSelect.innerHTML = PANGKAT_LIST.map((p) => `<option value="${p}">${p}</option>`).join("");
  pangkatSelect.value = PANGKAT_LIST[PANGKAT_LIST.length - 1]; // default: pangkat terendah

  const noteEl = $("pangkat-note");
  const cekNote = () => {
    const auto = pangkatAutoHC(pangkatSelect.value);
    noteEl.classList.toggle("show", auto);
    $("kode-wrap").style.display = auto ? "" : "none";
    $("auth-sub-reg").textContent = auto ? "Pangkat ini langsung aktif tanpa approval." : "Akun kamu perlu di-approve Perwira Tinggi dulu sebelum bisa login.";
  };
  pangkatSelect.addEventListener("change", cekNote);

  // ====== Verifikasi email: kirim kode 6 digit ke Gmail ======
  let verifToken = null;
  let timer = null;
  const kirimBtn = $("kirim-kode");
  const hintEl = $("kode-hint");
  const hintAwal = hintEl.textContent;

  // Ganti email setelah kode terkirim -> kode lama nggak berlaku lagi
  $("reg-email").addEventListener("input", () => { verifToken = null; hintEl.style.color = ""; hintEl.textContent = hintAwal; });

  function cooldown(detik) {
    clearInterval(timer);
    kirimBtn.disabled = true;
    let sisa = detik;
    kirimBtn.textContent = `Kirim Ulang (${sisa})`;
    timer = setInterval(() => {
      sisa -= 1;
      if (sisa <= 0) { clearInterval(timer); kirimBtn.disabled = false; kirimBtn.textContent = "Kirim Ulang"; }
      else kirimBtn.textContent = `Kirim Ulang (${sisa})`;
    }, 1000);
  }

  kirimBtn.addEventListener("click", async () => {
    hintEl.style.color = "";
    const username = $("reg-username").value.trim();
    const email = $("reg-email").value.trim();
    if (!username || !email) { hintEl.style.color = "var(--danger)"; hintEl.textContent = "Isi username dan email dulu."; return; }
    kirimBtn.disabled = true; kirimBtn.textContent = "Mengirim...";
    try {
      const r = await api("/api/auth-login", { method: "POST", body: JSON.stringify({ kirimKode: true, username, email }) });
      verifToken = r.token;
      hintEl.style.color = "var(--green)";
      hintEl.textContent = r.message || "Kode sudah dikirim ke email kamu (cek juga folder Spam).";
      cooldown(60);
    } catch (e) {
      hintEl.style.color = "var(--danger)";
      hintEl.textContent = e.message;
      kirimBtn.disabled = false; kirimBtn.textContent = "Kirim Kode";
    }
  });

  $("register-btn").addEventListener("click", doRegister);

  async function doRegister() {
    const errorEl = $("error-msg");
    errorEl.style.color = "";
    errorEl.textContent = "";
    const username = $("reg-username").value.trim();
    const email = $("reg-email").value.trim();
    const kodeEmail = $("reg-kode-email").value.trim();
    const password = $("reg-password").value;
    const namaKarakter = $("reg-nama").value.trim();
    const pangkat = pangkatSelect.value;

    if (!username || !email || !password) { errorEl.textContent = "Username, email & password wajib diisi."; return; }
    if (!verifToken) { errorEl.textContent = "Klik Kirim Kode dulu buat verifikasi email kamu."; return; }
    if (!/^\d{6}$/.test(kodeEmail)) { errorEl.textContent = "Kode verifikasi harus 6 digit dari email."; return; }
    if (password.length < 6) { errorEl.textContent = "Password minimal 6 karakter."; return; }
    if (!namaKarakter) { errorEl.textContent = "Nama karakter wajib diisi."; return; }

    const btn = $("register-btn");
    btn.disabled = true; btn.textContent = "Mendaftar...";
    try {
      const r = await api("/api/auth-login", { method: "POST", body: JSON.stringify({ daftar: true, username, email, password, namaKarakter, pangkat, verifToken, kodeEmail, kode: $("reg-kode").value }) });
      errorEl.style.color = "var(--green)";
      errorEl.textContent = r.langsung ? "Akun High Command kamu langsung aktif. Silakan login." : "Pendaftaran berhasil dikirim! Tunggu approval dari Perwira Tinggi sebelum bisa login.";
      ["reg-username","reg-email","reg-kode-email","reg-password","reg-nama","reg-kode"].forEach((id) => { $(id).value = ""; });
      pangkatSelect.value = PANGKAT_LIST[PANGKAT_LIST.length - 1];
      verifToken = null; clearInterval(timer); kirimBtn.disabled = false; kirimBtn.textContent = "Kirim Kode";
      hintEl.style.color = ""; hintEl.textContent = hintAwal;
      cekNote();
    } catch (e) {
      errorEl.style.color = "";
      errorEl.textContent = e.message;
    } finally {
      btn.disabled = false; btn.textContent = "Daftar";
    }
  }
</script>
</body>
</html>
