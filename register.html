<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1b2e">
    <title>Kepolisian Nexotis - Daftar Akun</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-wrap auth">
    <div class="login-card">
      <div class="auth-head">
        <div class="auth-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z"/><path d="M12 8.2l1.2 2.4 2.6.4-1.9 1.8.5 2.6-2.4-1.3-2.4 1.3.5-2.6-1.9-1.8 2.6-.4z" fill="currentColor" stroke="none"/></svg></div>
        <h1>DAFTAR AKUN BARU</h1>
        <p class="auth-sub" id="auth-sub-reg">Akun kamu perlu di-approve Perwira Tinggi dulu sebelum bisa login.</p>
      </div>
      <div class="form-group">
        <label for="reg-username">Username</label>
        <div class="field"><svg class="ico-l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg><input type="text" id="reg-username" placeholder="username buat login" autocomplete="username"></div>
      </div>
      <div class="form-group">
        <label for="reg-email">Email (Gmail)</label>
        <div class="field"><svg class="ico-l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><input type="email" id="reg-email" placeholder="contoh@gmail.com" autocomplete="email"></div>
        <div class="hint">Dipakai buat kirim detail akun kalau kamu lupa username / password.</div>
      </div>
      <div class="form-group">
        <label for="reg-password">Password</label>
        <div class="field has-eye"><svg class="ico-l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><input type="password" id="reg-password" placeholder="minimal 6 karakter" autocomplete="new-password"><button type="button" class="eye" aria-label="Lihat/sembunyikan password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      </div>
      <div class="form-group">
        <label for="reg-nama">Nama Karakter</label>
        <div class="field"><svg class="ico-l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="11" r="2.2"/><path d="M5.5 17c.6-1.8 2-2.6 3.5-2.6s2.9.8 3.5 2.6M15 9h3M15 12.5h3"/></svg><input type="text" id="reg-nama" placeholder="nama character kamu" autocomplete="off"></div>
      </div>
      <div class="form-group">
        <label for="reg-pangkat">Pangkat yang Diajukan</label>
        <div class="field"><svg class="ico-l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg><select id="reg-pangkat"></select></div>
        <div class="auth-note" id="pangkat-note"><b>Pangkat tertinggi:</b> langsung aktif sebagai High Command, tanpa menunggu approval.</div>
      </div>
      <div class="form-group" id="kode-wrap" style="display:none">
        <label for="reg-kode">Kode Akses <span style="font-weight:400;color:var(--faint)">(kalau diminta)</span></label>
        <div class="field"><svg class="ico-l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/></svg><input type="password" id="reg-kode" placeholder="kosongkan kalau nggak ada" autocomplete="off"></div>
      </div>
      <button class="btn btn-primary" id="register-btn">Daftar</button>
      <div class="error-msg" id="error-msg"></div>
      <div class="foot">Sudah punya akun? <a href="index.html">Masuk di sini</a></div>
    </div>
  </div>

<script src="app.js"></script>
<script>
  const pangkatSelect = document.getElementById("reg-pangkat");
  pangkatSelect.innerHTML = PANGKAT_LIST.map((p) => `<option value="${p}">${p}</option>`).join("");
  pangkatSelect.value = PANGKAT_LIST[PANGKAT_LIST.length - 1]; // default: pangkat terendah
  const noteEl = document.getElementById("pangkat-note");
  const cekNote = () => {
    const auto = pangkatAutoHC(pangkatSelect.value);
    noteEl.classList.toggle("show", auto);
    document.getElementById("kode-wrap").style.display = auto ? "" : "none";
    document.getElementById("auth-sub-reg").textContent = auto ? "Pangkat ini langsung aktif tanpa approval." : "Akun kamu perlu di-approve Perwira Tinggi dulu sebelum bisa login.";
  };
  pangkatSelect.addEventListener("change", cekNote);

  document.getElementById("register-btn").addEventListener("click", doRegister);

  async function doRegister() {
    const errorEl = document.getElementById("error-msg");
    errorEl.style.color = "";
    errorEl.textContent = "";
    const username = document.getElementById("reg-username").value.trim();
    const email = document.getElementById("reg-email").value.trim();
    const password = document.getElementById("reg-password").value;
    const namaKarakter = document.getElementById("reg-nama").value.trim();
    const pangkat = pangkatSelect.value;

    if (!username || !email || !password) { errorEl.textContent = "Username, email & password wajib diisi."; return; }
    if (!namaKarakter) { errorEl.textContent = "Nama karakter wajib diisi."; return; }
    if (password.length < 6) { errorEl.textContent = "Password minimal 6 karakter."; return; }

    const btn = document.getElementById("register-btn");
    btn.disabled = true; btn.textContent = "Mendaftar...";
    try {
      const r = await api("/api/auth-login", { method: "POST", body: JSON.stringify({ daftar: true, username, email, password, namaKarakter, pangkat, kode: document.getElementById("reg-kode").value }) });
      errorEl.style.color = "var(--green)";
      errorEl.textContent = r.langsung ? "Akun High Command kamu langsung aktif. Silakan login." : "Pendaftaran berhasil dikirim! Tunggu approval dari Perwira Tinggi sebelum bisa login.";
      document.getElementById("reg-username").value = "";
      document.getElementById("reg-kode").value = "";
      document.getElementById("reg-email").value = "";
      document.getElementById("reg-password").value = "";
      document.getElementById("reg-nama").value = "";
      pangkatSelect.value = PANGKAT_LIST[PANGKAT_LIST.length - 1];
      cekNote();
    } catch (e) {
      errorEl.style.color = "";
      errorEl.textContent = e.message;
    } finally {
      btn.disabled = false; btn.textContent = "Daftar";
    }
  }
</script>
</body>
</html>
